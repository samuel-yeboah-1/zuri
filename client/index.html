<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zuri Travel — Curated South Africa Experiences</title>
    <meta name="description" content="Luxury curated trips to South Africa. Aquariums, nightlife, hotel pickups, safari, wine tours, and coastal adventures — handled end to end." />
    <!-- Prevent flash of wrong theme -->
    <script>
      (function () {
        var s = localStorage.getItem('zuri-theme');
        var p = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', s || p);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
