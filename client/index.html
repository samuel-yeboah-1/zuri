<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/Zuri Travels Logo PNG (B).png" />
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts early, non-blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" />
    <!-- Preload above-the-fold logo -->
    <link rel="preload" as="image" href="/images/Zuri Travels Logo PNG (B).png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zuri Travel — Curated South Africa Experiences</title>
    <meta name="description" content="Luxury curated trips to South Africa. Aquariums, nightlife, hotel pickups, safari, wine tours, and coastal adventures — handled end to end." />
    <!-- Prevent flash of wrong theme -->
    <script>
      (function () {
        var s = localStorage.getItem('zuri-theme');
        var p = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', s || p);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
